# Génère les cartes de statistiques du profil, dépôts privés inclus.
# Secret requis : METRICS_TOKEN (PAT classique ; repo, read:org, read:user suffisent).
name: Metrics

on:
  schedule:
    - cron: "0 4 * * *" # tous les jours à 4h UTC (= heure d'Abidjan)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Action épinglée sur le commit de la release v3.34 pour éviter toute mise à jour non contrôlée.
      - name: Vue d'ensemble (privés inclus)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Ky-Wilson
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Abidjan
          repositories_affiliations: owner, collaborator, organization_member

      - name: Calendrier de contributions
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics/calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Ky-Wilson
          base: ""
          config_timezone: Africa/Abidjan
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Le plugin "languages" de metrics renvoie une carte vide : la carte est générée par un script maison.
      - name: Récupère les cartes générées
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Langages (tous les dépôts)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/languages.py

      - name: Commit de la carte des langages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/languages.svg
          git diff --cached --quiet || git commit -m "Update metrics/languages.svg - [Skip GitHub Action]"
          git push
